[workspace]
resolver = "3"
members = ["crates/unc-core", "crates/unc-asm", "crates/unc-wasm", "crates/unc-lsp"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unc64/unc64"
homepage = "https://unc64.com"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
